backend:
  name: github
  repo: As45671234/arcmet # Replace with your GitHub repository
  branch: main

media_folder: "public/img/products"
public_folder: "/img/products"

collections:
  - name: "products"
    label: "Products"
    folder: "src/data/products" # We will use individual files for CMS editing, or a single file?
    # Decap CMS works best with individual files (markdown/json) per item.
    # But the user asked for "products.json".
    # To edit a single JSON file with a list of products, we use a "file" collection.
    create: true
    slug: "{{slug}}"
    files:
      - file: "src/data/products.json"
        label: "Products Catalog"
        name: "products"
        fields:
          - label: "Products List"
            name: "products"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Гидроизоляция", "Теплоизоляция", "Кровельные системы", "Вентиляция"]}
              - {label: "Image", name: "image", widget: "image"}
